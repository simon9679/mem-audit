name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps (offline path only — no mem0ai/openai needed for tests)
        run: pip install numpy rich click

      - name: Compile check
        run: find mem_audit examples tests -name "*.py" | xargs -n1 python -m py_compile

      - name: Run offline demo (smoke test)
        run: PYTHONPATH=. python examples/demo_offline.py

      - name: Run tests
        run: |
          PYTHONPATH=. python tests/test_pipeline.py
          PYTHONPATH=. python tests/test_embeddings.py
          PYTHONPATH=. python tests/test_resilience.py
          PYTHONPATH=. python tests/test_judge_prompt.py
          PYTHONPATH=. python tests/test_connector_pagesize.py
          PYTHONPATH=. python tests/test_report.py
          PYTHONPATH=. python tests/test_providers.py
